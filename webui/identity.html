<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>身份认知</title>
<style>
  :root {
    --bg: #1a1614; --card: #221d1a; --border: #3a322c;
    --text: #e8e0d8; --muted: #9a8d80; --accent: #d4693a;
    --accent-dim: #8a4429; --danger: #c0453a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.6;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 18px; margin-bottom: 14px;
  }
  .row { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  label {
    display: block; font-size: 12px; color: var(--muted);
    margin-bottom: 5px; letter-spacing: .3px;
  }
  /* 输入框提亮，和卡片拉开对比 */
  input[type="text"], select, textarea {
    background: #1c1815 !important;
  }

  /* 顶部固定状态栏 */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: baseline; gap: 12px;
    padding: 10px 0 14px; margin: -10px 0 6px;
    background: linear-gradient(var(--bg) 82%, transparent);
  }
  .topbar h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .topbar .status { margin-left: auto; font-size: 12px; }
  .topbar .status.ok { color: #6fbf73; }
  .topbar .status.err { color: var(--danger); }
  .topbar .status.dirty { color: var(--muted); }

  /* 可折叠卡片 */
  .card-title {
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none;
    font-size: 13px; color: var(--muted); letter-spacing: .3px;
    padding-bottom: 10px;
  }
  .card-title:hover { color: var(--text); }
  .card-title .caret {
    display: inline-block; width: 10px; transition: transform .15s;
    font-size: 10px; opacity: .7;
  }
  .card.collapsed .caret { transform: rotate(-90deg); }
  .card.collapsed .card-body { display: none; }
  .card-body { }

  /* 一行式名单项 */
  .entry-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 0; border-top: 1px solid var(--border);
  }
  .entry-row:first-child { border-top: none; }
  .entry-row .idx {
    font-size: 12px; color: var(--muted); width: 22px; flex: 0 0 auto;
  }
  .entry-row input[type="text"] { flex: 1 1 140px; min-width: 110px; padding: 6px 9px; }
  .entry-row select { flex: 0 0 auto; padding: 6px 9px; }
  .entry-row .care-mini {
    display: flex; align-items: center; gap: 6px;
    flex: 0 0 auto; font-size: 12px; color: var(--muted);
  }
  .entry-row .care-mini input[type="range"] { width: 90px; }
  .entry-row .care-mini .val {
    color: var(--accent); font-weight: 600; min-width: 14px; text-align: center;
  }
  .entry-row .del {
    flex: 0 0 auto; font-size: 16px; line-height: 1;
  }

  /* 分组框（添加新身份） */
  .add-box {
    border: 1px dashed var(--border); border-radius: 8px;
    padding: 12px 14px; margin-top: 14px;
    background: rgba(255,255,255,.012);
  }
  .add-box .add-title {
    font-size: 12px; color: var(--muted); margin-bottom: 10px;
  }
  .add-box .row { margin-bottom: 0; }

  /* 空状态 */
  .empty-state {
    text-align: center; padding: 28px 16px; color: var(--muted);
  }
  .empty-state .big { font-size: 26px; opacity: .5; margin-bottom: 8px; }
  .empty-state .txt { font-size: 13px; margin-bottom: 14px; }

  input[type="text"] {
    width: 100%; background: #17130f; border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); padding: 8px 10px;
    font-size: 14px; font-family: inherit; outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent-dim); }
  textarea {
    width: 100%; min-height: 62px; background: #17130f;
    border: 1px solid var(--border); border-radius: 6px; color: var(--text);
    padding: 8px 10px; font-size: 13px; font-family: inherit;
    line-height: 1.55; resize: vertical; outline: none;
  }
  textarea:focus { border-color: var(--accent-dim); }

  .slider-block { flex: 1 1 260px; }
  .slider-head {
    display: flex; justify-content: space-between;
    align-items: baseline; margin-bottom: 2px;
  }
  .slider-value {
    font-size: 13px; color: var(--accent); font-weight: 600;
    min-width: 34px; text-align: right;
  }
  input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
    border-radius: 3px; background: #3a322c; outline: none; margin: 10px 0 6px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
    border-radius: 50%; background: var(--accent);
    border: 2px solid #2a211c; cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: 2px solid #2a211c; cursor: pointer;
  }
  .slider-ticks {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--muted); padding: 0 2px;
  }
  .slider-hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .entry { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 14px; }
  .entry:first-child { border-top: none; padding-top: 0; margin-top: 0; }
  .entry-head {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 10px;
  }
  .entry-idx { font-size: 12px; color: var(--muted); }

  select {
    background: #17130f; border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); padding: 8px 10px;
    font-size: 14px; font-family: inherit; outline: none; min-width: 110px;
  }
  button {
    background: var(--accent); border: none; border-radius: 6px;
    color: #fff; padding: 9px 18px; font-size: 13px;
    font-family: inherit; cursor: pointer; font-weight: 500;
  }
  button:hover { background: #e07a4a; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); padding: 7px 14px;
  }
  button.ghost:hover {
    border-color: var(--accent-dim); color: var(--text); background: transparent;
  }
  button.del {
    background: transparent; border: none; color: var(--danger);
    font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 6px;
  }
  button.del:hover { color: #ff6b5a; background: transparent; }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
  .msg { font-size: 12px; margin-left: auto; }
  .msg.ok { color: #6fbf73; }
  .msg.err { color: var(--danger); }

  .section-title {
    font-size: 13px; color: var(--muted); letter-spacing: .3px;
    margin: 0 0 12px; text-transform: uppercase;
  }
  .care-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .care-grid { grid-template-columns: 1fr; } }

  .loading { color: var(--muted); text-align: center; padding: 40px 0; }
  .level-tag {
    display: inline-block; font-size: 11px; padding: 1px 7px;
    border-radius: 4px; background: var(--accent-dim);
    color: #f0d8c8; margin-left: 6px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>身份认知</h1>
    <span class="status" id="status"></span>
  </div>
  <div class="sub">给每个人单独设定身份和关心频率；没列出来的人自动按「群友」处理。</div>
  <div id="app"><div class="loading">加载中…</div></div>
</div>

<script>
(function () {
  var LEVELS = [
    { value: 1, name: "不提", desc: "完全不主动关心" },
    { value: 2, name: "偶尔", desc: "偶尔提一句" },
    { value: 3, name: "正常", desc: "自然关心" },
    { value: 4, name: "经常", desc: "可以多关心几句" }
  ];
  var BASE_LABELS = ["主人", "朋友", "群友"];

  // 合法身份 = 内置三档 + 自定义身份（去重、保持顺序）
  function allLabels() {
    var custom = Object.keys((state && state.custom_styles) || {});
    var out = BASE_LABELS.slice();
    custom.forEach(function (n) {
      if (n && out.indexOf(n) < 0) out.push(n);
    });
    return out;
  }

  var state = null;
  var dirty = false;

  // 宿主注入的 SDK：window.maibot.query / action
  // 注意：页面 CSP 是 connect-src 'none'，不能用 fetch，只能走 SDK 端口
  var api = {
    load: function () { return window.maibot.query("load", {}); },
    save: function (data) {
      return window.maibot.action("save", { data: JSON.stringify(data) });
    }
  };

  // ── 自动保存 ────────────────────────────────────────────────
  // 添加/删除档位这类结构性改动立刻存；输入类改动防抖后再存。
  var saveTimer = null;
  var saving = false;

  function doSave(onDone) {
    if (saving) return;
    saving = true;
    collect();
    setMsg("保存中…", "");
    api.save({
      roster: state.roster,
      care_texts: state.care_texts,
      styles: state.styles || {},
      custom_styles: state.custom_styles || {},
      default_label: state.default_label,
      inject_for_others: state.inject_for_others
    }).then(function () {
      dirty = false;
      var d = new Date();
      var hh = ("0" + d.getHours()).slice(-2);
      var mi = ("0" + d.getMinutes()).slice(-2);
      var ss = ("0" + d.getSeconds()).slice(-2);
      setMsg("已自动保存 " + hh + ":" + mi + ":" + ss, "ok");
      if (onDone) onDone();
    }).catch(function (err) {
      setMsg("保存失败：" + err.message, "err");
    }).then(function () {
      saving = false;
    });
  }

  function autoSave(immediate, onDone) {
    dirty = true;
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    if (immediate) { doSave(onDone); return; }
    setMsg("未保存…", "");
    saveTimer = setTimeout(function () {
      saveTimer = null;
      doSave(onDone);
    }, 800);
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function levelName(v) {
    for (var i = 0; i < LEVELS.length; i++) {
      if (LEVELS[i].value === Number(v)) return LEVELS[i].name;
    }
    return "正常";
  }

  function renderEntry(e, i) {
    var lv = Number(e.care_level) || 3;
    var opts = allLabels().map(function (l) {
      return '<option value="' + l + '"' + (e.label === l ? " selected" : "") + ">" + l + "</option>";
    }).join("");
    return ''
      + '<div class="entry-row" data-idx="' + i + '">'
      +   '<span class="idx">#' + (i + 1) + "</span>"
      +   '<input type="text" data-act="id" data-idx="' + i + '" value="'
      +   esc(e.user_id) + '" placeholder="QQ 号">'
      +   '<select data-act="label" data-idx="' + i + '">' + opts + "</select>"
      +   '<span class="care-mini">'
      +     '<input type="range" min="1" max="4" step="1" value="' + lv + '" data-act="care" data-idx="' + i + '">'
      +     '<span class="val" data-care-val="' + i + '">' + lv + "</span>"
      +   "</span>"
      +   '<button class="del" data-act="del" data-idx="' + i + '" title="删除">×</button>'
      + "</div>";
  }

  function renderCareTexts(care) {
    return LEVELS.map(function (l) {
      return '<div class="field">'
        + "<label>「" + l.name + "」档的措辞</label>"
        + '<textarea data-care="' + l.value + '">' + esc(care[l.value] || "") + "</textarea>"
        + "</div>";
    }).join("");
  }

  var STYLE_ROWS = [
    { key: "owner_style", name: "主人", hint: "最亲近的那个人" },
    { key: "friend_style", name: "朋友", hint: "聊得挺多的熟人" },
    { key: "member_style", name: "群友", hint: "名单外的人默认按这档" }
  ];

  function renderStyles(styles) {
    return STYLE_ROWS.map(function (row) {
      return '<div class="field">'
        + '<label>' + row.name + '身份提示词'
        + '<span style="color:var(--muted);font-weight:400;margin-left:8px;">（' + row.hint + '）</span></label>'
        + '<textarea data-style="' + row.key + '" style="min-height:80px;">'
        + esc(styles[row.key] || "") + "</textarea>"
        + "</div>";
    }).join("");
  }

  function renderCustomStyles(custom) {
    var names = Object.keys(custom || {});
    var rows = names.map(function (name, i) {
      return '<div class="entry" data-cidx="' + i + '">'
        +   '<div class="entry-head">'
        +     '<span class="entry-idx">' + esc(name) + "</span>"
        +     '<button class="del" data-act="cdel" data-cidx="' + i + '" title="删除">×</button>'
        +   "</div>"
        +   '<div class="field">'
        +     '<label>这一档的注入提示词</label>'
        +     '<textarea data-custom="' + esc(name) + '" style="min-height:70px;">'
        +     esc(custom[name] || "") + "</textarea>"
        +   "</div>"
        + "</div>";
    }).join("");
    if (!rows) {
      rows = '<div style="color:var(--muted);font-size:13px;padding:8px 0;">'
        + "还没有自定义身份。可以按需要加，比如「同事」「家人」。</div>";
    }
    return rows;
  }

  // 可折叠卡片的标题
  function title(text, key) {
    return '<div class="card-title" data-toggle="' + key + '">'
      + '<span class="caret">▼</span><span>' + esc(text) + '</span></div>';
  }

  // 记住哪些卡片是展开的（刷新后保留）
  var openCards = {};
  try {
    openCards = JSON.parse(localStorage.getItem("dsh_identity_open") || "{}") || {};
  } catch (e) { openCards = {}; }

  function applyCollapse() {
    document.querySelectorAll("[data-card]").forEach(function (card) {
      var key = card.getAttribute("data-card");
      if (openCards[key]) card.classList.remove("collapsed");
    });
  }

  function render() {
    var app = document.getElementById("app");
    if (!state) { app.innerHTML = '<div class="loading">加载失败</div>'; return; }

    var entries = (state.roster || []).map(renderEntry).join("");
    var empty = (state.roster || []).length === 0
      ? '<div class="empty-state">'
        + '<div class="big">📋</div>'
        + '<div class="txt">名单还是空的</div>'
        + '<button class="ghost" data-act="add">+ 添加名单</button>'
        + "</div>"
      : "";
    var defOpts = allLabels().map(function (l) {
      return '<option value="' + l + '"' + (state.default_label === l ? " selected" : "") + ">" + l + "</option>";
    }).join("");

    app.innerHTML = ''
      + '<div class="card" data-card="roster">'
      +   title('身份名单', 'roster')
      +   '<div class="card-body">'
      +   entries + empty
      +   ((state.roster || []).length === 0
            ? ""
            : '<div style="margin-top:14px;">'
              + '<button class="ghost" data-act="add">+ 添加名单</button>'
              + "</div>")
      +   "</div>"
      + "</div>"
      + '<div class="card collapsed" data-card="styles">'
      +   title('默认身份提示词', 'styles')
      +   '<div class="card-body">'
      +   renderStyles(state.styles || {})
      +   '<div class="slider-hint">这段决定「这个身份的人」怎么跟她说话；修改后立即生效。</div>'
      +   "</div>"
      + "</div>"
      + '<div class="card collapsed" data-card="custom">'
      +   title('自定义身份和身份提示词', 'custom')
      +   '<div class="card-body">'
      +   renderCustomStyles(state.custom_styles || {})
      +   '<div class="add-box">'
      +     '<div class="add-title">+ 添加新身份</div>'
      +     '<div class="row" style="align-items:flex-end;">'
      +       '<div class="field" style="flex:0 0 150px;">'
      +         '<label>身份名</label>'
      +         '<input type="text" data-act="cname" placeholder="例如 同事" maxlength="16">'
      +       "</div>"
      +       '<div class="field" style="flex:1 1 240px;">'
      +         '<label>注入提示词</label>'
      +         '<input type="text" data-act="cprompt" placeholder="例如 跟你说话的是同组同事，客气但不热乎">'
      +       "</div>"
      +       '<div class="field" style="flex:0 0 auto;">'
      +         '<button class="ghost" data-act="cadd">添加</button>'
      +       "</div>"
      +     "</div>"
      +   "</div>"
      +   '<div class="slider-hint">加好的身份会出现在上面「身份」的下拉里；内置的三档不支持改名。</div>'
      +   "</div>"
      + "</div>"
      + '<div class="card collapsed" data-card="care">'
      +   title('各个关心频率注入的提示词', 'care')
      +   '<div class="card-body">'
      +   '<div class="care-grid">' + renderCareTexts(state.care_texts || {}) + "</div>"
      +   '<div class="slider-hint">每档具体说什么由这里决定；滑块只负责选哪一档。</div>'
      +   "</div>"
      + "</div>"
      + '<div class="card collapsed" data-card="other">'
      +   title('其他', 'other')
      +   '<div class="card-body">'
      +   '<div class="field">'
      +     "<label>名单外的人按哪一档对待</label>"
      +     '<select data-act="default_label">' + defOpts + "</select>"
      +   "</div>"
      +   '<div class="field">'
      +     '<label><input type="checkbox" data-act="inject_for_others"'
      +       (state.inject_for_others ? " checked" : "")
      +       ' style="width:auto;margin-right:6px;vertical-align:-2px;">'
      +     "对名单外的人也注入身份（关闭更省 token）</label>"
      +   "</div>"
      +   "</div>"
      + "</div>"
      + '<div class="toolbar">'
      +   '<button data-act="save">保存</button>'
      +   '<button class="ghost" data-act="reload">重新加载</button>'
      + "</div>";
    applyCollapse();
    bind();
  }

  function bind() {
    // 折叠卡片
    document.querySelectorAll("[data-toggle]").forEach(function (el) {
      el.onclick = function () {
        var key = el.getAttribute("data-toggle");
        var card = el.closest("[data-card]");
        if (!card) return;
        var nowOpen = card.classList.contains("collapsed");
        card.classList.toggle("collapsed");
        openCards[key] = nowOpen;
        try {
          localStorage.setItem("dsh_identity_open", JSON.stringify(openCards));
        } catch (e) { /* 忽略 */ }
      };
    });

    document.querySelectorAll("[data-act]").forEach(function (el) {
      var act = el.getAttribute("data-act");

      if (act === "add") {
        el.onclick = function () {
          state.roster = state.roster || [];
          state.roster.push({ user_id: "", label: "朋友", care_level: 3 });
          render();
        };
      } else if (act === "save") {
        el.onclick = function () {
          var btn = el;
          btn.disabled = true;
          if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
          doSave(function () { btn.disabled = false; });
        };
      } else if (act === "reload") {
        el.onclick = function () { load(true); };
      } else if (act === "del") {
        el.onclick = function () {
          var i = Number(el.getAttribute("data-idx"));
          state.roster.splice(i, 1);
          render();
          autoSave(true);
        };
      } else if (act === "care") {
        el.oninput = function () {
          var i = Number(el.getAttribute("data-idx"));
          var v = Number(el.value);
          state.roster[i].care_level = v;
          var row = el.closest(".entry-row");
          var valEl = row && row.querySelector('[data-care-val="' + i + '"]');
          if (valEl) valEl.textContent = v;
          autoSave(false);
        };
      } else if (act === "id") {
        el.oninput = function () {
          var i = Number(el.getAttribute("data-idx"));
          state.roster[i].user_id = el.value.trim();
          autoSave(false);
        };
      } else if (act === "label") {
        el.onchange = function () {
          var i = Number(el.getAttribute("data-idx"));
          state.roster[i].label = el.value;
          autoSave(false);
        };
      } else if (act === "default_label") {
        el.onchange = function () { state.default_label = el.value; autoSave(false); };
      } else if (act === "inject_for_others") {
        el.onchange = function () { state.inject_for_others = el.checked; autoSave(false); };
      } else if (act === "cadd") {
        el.onclick = function () {
          var nameEl = document.querySelector('[data-act="cname"]');
          var promptEl = document.querySelector('[data-act="cprompt"]');
          var name = (nameEl && nameEl.value || "").trim();
          var prompt = (promptEl && promptEl.value || "").trim();
          if (!name) { setMsg("身份名不能为空", "err"); return; }
          if (name.length > 16) { setMsg("身份名最多 16 个字", "err"); return; }
          if (BASE_LABELS.indexOf(name) >= 0) { setMsg("「" + name + "」是内置档位，不用自定义", "err"); return; }
          if (!prompt) { setMsg("提示词不能为空", "err"); return; }
          state.custom_styles = state.custom_styles || {};
          state.custom_styles[name] = prompt;
          render();
          autoSave(true);
        };
      } else if (act === "cdel") {
        el.onclick = function () {
          var i = Number(el.getAttribute("data-cidx"));
          var key = Object.keys(state.custom_styles || {})[i];
          if (!key) return;
          // 有人正在用这个身份 -> 二次确认
          var usedBy = (state.roster || []).filter(function (e) { return e.label === key; });
          if (usedBy.length > 0) {
            var ok = window.confirm(
              "「" + key + "」还有 " + usedBy.length + " 个人在用。\n" +
              "删掉后他们会变回「朋友」。确定删除吗？"
            );
            if (!ok) return;
          }
          delete state.custom_styles[key];
          // 如果名单里有人用这个档位，一并回落，避免出现悬空档位
          (state.roster || []).forEach(function (e) {
            if (e.label === key) e.label = "朋友";
          });
          render();
          autoSave(true);
        };
      }
    });

    document.querySelectorAll("[data-care]").forEach(function (el) {
      el.oninput = function () {
        state.care_texts[el.getAttribute("data-care")] = el.value;
        autoSave(false);
      };
    });

    document.querySelectorAll("textarea[data-style]").forEach(function (el) {
      el.oninput = function () {
        state.styles = state.styles || {};
        state.styles[el.getAttribute("data-style")] = el.value;
        autoSave(false);
      };
    });

    document.querySelectorAll("textarea[data-custom]").forEach(function (el) {
      el.oninput = function () {
        state.custom_styles = state.custom_styles || {};
        state.custom_styles[el.getAttribute("data-custom")] = el.value;
        autoSave(false);
      };
    });
  }

  function collect() {
    state.roster = (state.roster || []).filter(function (e) {
      return String(e.user_id || "").trim();
    });
  }

  function setMsg(text, cls) {
    var m = document.getElementById("status");
    if (!m) return;
    m.textContent = text || "";
    m.className = "status " + (cls || "");
  }

  function load(force) {
    if (dirty && !force) return;
    setMsg("加载中…", "");
    window.maibot.ready.then(function () {
      return api.load();
    }).then(function (raw) {
      // 宿主可能把插件 API 的返回值包一层（{success, data} 或 {result}），
      // 这里统一拆到真正的那层，避免 roster 读不到导致显示「还没有人」。
      var data = raw || {};
      if (!data.roster) {
        if (data.data && typeof data.data === "object") data = data.data;
        else if (data.result && typeof data.result === "object") data = data.result;
      }
      state = data || {};
      state.roster = state.roster || [];
      state.care_texts = state.care_texts || {};
      state.styles = state.styles || {};
      state.custom_styles = state.custom_styles || {};
      dirty = false;
      render();
      setMsg("", "");
    }).catch(function (err) {
      document.getElementById("app").innerHTML =
        '<div class="loading">加载失败：' + esc(err.message) + "</div>";
    });
  }

  window.addEventListener("beforeunload", function (e) {
    if (dirty) { e.preventDefault(); e.returnValue = ""; }
  });

  load();
})();
</script>
</body>
</html>
